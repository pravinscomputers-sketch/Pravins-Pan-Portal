<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRAVINS PAN PORTAL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;color:#fff;font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at 10% 10%,#172554 0,transparent 35%),
             radial-gradient(circle at 90% 90%,#312e81 0,transparent 35%),#070b16;
}
.container{width:100%;max-width:1050px;display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:center}
.brand{padding:20px}
.logo{
  width:68px;height:68px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#facc15,#eab308);color:#111827;font-size:30px;font-weight:900;
  box-shadow:0 12px 35px rgba(250,204,21,.25);margin-bottom:25px
}
.brand h1{font-size:clamp(34px,5vw,54px);line-height:1.04;letter-spacing:-1px}
.brand h1 span{color:#facc15}
.brand p{margin-top:18px;color:#aab4c8;font-size:16px;line-height:1.7;max-width:450px}
.features{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.feature{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);padding:10px 14px;border-radius:50px;color:#dbe4f3;font-size:13px}
.login-card{
  background:rgba(15,23,42,.88);border:1px solid rgba(255,255,255,.09);border-radius:28px;
  padding:32px;box-shadow:0 30px 80px rgba(0,0,0,.45);backdrop-filter:blur(20px)
}
.login-card h2{font-size:27px;margin-bottom:8px}
.subtitle{color:#8995aa;font-size:14px;margin-bottom:25px}
.role-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.role-btn{
  border:1px solid #273449;background:#111827;color:#9ca8bb;padding:14px 10px;border-radius:14px;
  cursor:pointer;font-weight:700;transition:.2s
}
.role-btn.active{background:linear-gradient(135deg,#facc15,#eab308);color:#111827;border-color:transparent}
.role-btn:hover{transform:translateY(-1px)}
.form-group{margin-bottom:17px}
.form-group label{display:block;color:#cbd5e1;font-size:13px;margin-bottom:8px}
.input-box{position:relative}
.input-box .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#64748b}
input{
  width:100%;padding:14px 43px;border-radius:13px;border:1px solid #263449;background:#0b1220;
  color:#fff;outline:none;font-size:14px;transition:.2s
}
input:focus{border-color:#facc15;box-shadow:0 0 0 3px rgba(250,204,21,.08)}
.password-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:#64748b}
.login-btn{
  width:100%;border:0;padding:15px;border-radius:14px;margin-top:8px;
  background:linear-gradient(135deg,#facc15,#eab308);color:#111827;font-size:15px;font-weight:900;cursor:pointer;transition:.25s
}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(250,204,21,.18)}
.message{display:none;margin-top:15px;padding:12px;border-radius:10px;text-align:center;font-size:13px;background:rgba(239,68,68,.1);color:#fca5a5}
.footer{text-align:center;margin-top:22px;color:#596579;font-size:11px}
@media(max-width:800px){
  body{align-items:flex-start;padding:30px 16px}
  .container{grid-template-columns:1fr;gap:20px;max-width:500px}
  .brand{text-align:center;padding:5px}.logo{margin:0 auto 18px}
  .brand h1{font-size:34px}.brand p{margin-left:auto;margin-right:auto}
  .features{justify-content:center}.login-card{padding:24px 20px;border-radius:22px}
}
</style>
</head>
<body>
<div class="container">
<section class="brand">
  <div class="logo">P</div>
  <h1>PRAVINS<br><span>PAN PORTAL</span></h1>
  <p>A simple and secure digital portal for PAN card application services.</p>
  <div class="features">
    <div class="feature">🔐 Secure Login</div>
    <div class="feature">⚡ Fast Service</div>
    <div class="feature">📱 Mobile Friendly</div>
  </div>
</section>

<section class="login-card">
  <h2>Welcome Back</h2>
  <p class="subtitle">Select your account type to continue</p>

  <div class="role-buttons">
    <button class="role-btn active" id="adminBtn" onclick="selectRole('admin')">👨‍💼 Admin</button>
    <button class="role-btn" id="retailerBtn" onclick="selectRole('retailer')">🏪 Retailer</button>
  </div>

  <form id="loginForm">
    <div class="form-group">
      <label id="usernameLabel">Admin Username / Email</label>
      <div class="input-box">
        <span class="icon">👤</span>
        <input type="text" id="username" placeholder="Enter username or email" required>
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-box">
        <span class="icon">🔒</span>
        <input type="password" id="password" placeholder="Enter your password" required>
        <span class="password-toggle" onclick="togglePassword()" id="eye">👁</span>
      </div>
    </div>

    <button type="submit" class="login-btn" id="loginButton">ADMIN LOGIN</button>
  </form>

  <div class="message" id="message"></div>
  <div class="footer">© 2026 Pravins PAN Portal • All Rights Reserved</div>
</section>
</div>

<script>
let selectedRole="admin";

function selectRole(role){
  selectedRole=role;
  document.getElementById("adminBtn").classList.toggle("active",role==="admin");
  document.getElementById("retailerBtn").classList.toggle("active",role==="retailer");
  document.getElementById("usernameLabel").textContent =
    role==="admin" ? "Admin Username / Email" : "Retailer Username / Email";
  document.getElementById("loginButton").textContent =
    role==="admin" ? "ADMIN LOGIN" : "RETAILER LOGIN";
  document.getElementById("message").style.display="none";
}

function togglePassword(){
  const p=document.getElementById("password");
  const eye=document.getElementById("eye");
  p.type=p.type==="password" ? "text" : "password";
  eye.textContent=p.type==="password" ? "👁" : "🙈";
}

document.getElementById("loginForm").addEventListener("submit",function(e){
  e.preventDefault();
  const message=document.getElementById("message");
  message.style.display="block";
  message.textContent =
    selectedRole==="admin"
      ? "Login connection will be added with Supabase next."
      : "Retailer login connection will be added with Supabase next.";
});
</script>
</body>
</html>
