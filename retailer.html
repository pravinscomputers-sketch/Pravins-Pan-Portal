<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PRAVINS PAN PORTAL - Retailer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;color:#fff;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 10% 0%,#172554 0,transparent 35%),radial-gradient(circle at 100% 100%,#312e81 0,transparent 35%),#070b16}
.header{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(7,11,22,.8);backdrop-filter:blur(15px)}
.header-inner{max-width:1050px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo-title{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#facc15,#eab308);color:#111827;font-size:22px;font-weight:900}.title{font-size:20px;font-weight:900}.title span{color:#facc15}
.user-area{display:flex;align-items:center;gap:10px}.user-name{font-weight:700;font-size:14px}.user-label{font-size:11px;color:#7f8ba3;margin-top:3px}.logout{border:1px solid #334155;background:#111827;color:#cbd5e1;padding:9px 13px;border-radius:10px;cursor:pointer;font-weight:700}
.main{max-width:1050px;margin:auto;padding:35px 20px 60px}.welcome{margin-bottom:28px}.welcome h1{font-size:34px;margin-bottom:8px}.welcome p{color:#8f9bb1}
.service-card{max-width:480px;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.09);border-radius:24px;padding:25px;box-shadow:0 25px 65px rgba(0,0,0,.35)}
.service-icon{width:58px;height:58px;border-radius:16px;background:rgba(250,204,21,.12);display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:18px}.service-card h2{font-size:22px;margin-bottom:8px}.service-card p{color:#929db2;font-size:14px;line-height:1.6;margin-bottom:22px}
.apply-btn{width:100%;padding:15px;border:0;border-radius:13px;background:linear-gradient(135deg,#facc15,#eab308);color:#111827;font-size:15px;font-weight:900;cursor:pointer}.empty{color:#657188;font-size:13px;margin-top:20px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;padding:20px;z-index:10}.modal-box{width:100%;max-width:520px;background:#0f172a;border:1px solid #293750;border-radius:22px;padding:25px}.modal-box h2{margin-bottom:8px}.modal-box p{color:#94a3b8;font-size:14px;line-height:1.6}.close{float:right;background:none;border:0;color:#94a3b8;font-size:25px;cursor:pointer}.continue{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:#facc15;color:#111827;font-weight:900;cursor:pointer}
.form-card{max-width:520px}.form-card label{display:block;color:#cbd5e1;font-size:14px;margin:0 0 8px}.form-card input[type="text"],.form-card input[type="file"]{width:100%;padding:14px;border-radius:13px;border:1px solid #293750;background:#0b1220;color:#fff;font-size:14px;margin-bottom:16px}.form-card input[type="file"]{padding:11px}.file-note{font-size:12px;color:#8f9bb1;margin:-6px 0 8px}.form-message{display:none;margin-top:14px;padding:12px;border-radius:10px;font-size:13px;text-align:center}.form-message.ok{display:block;background:rgba(34,197,94,.1);color:#86efac}.form-message.err{display:block;background:rgba(239,68,68,.1);color:#fca5a5}.status-card{max-width:520px;margin-top:18px}.status-card h2{font-size:19px;margin-bottom:14px}.application-status{padding:13px;border:1px solid #293750;background:#0b1122;border-radius:12px;margin-top:10px}.application-status b{display:block;font-size:14px}.application-status small{display:block;color:#8f9bb1;margin-top:5px}.ack{margin-top:9px;color:#59e3a2;font-weight:800;font-size:13px}.pending-ack{margin-top:9px;color:#facc15;font-size:13px;font-weight:700}
@media(max-width:600px){.title{font-size:17px}.user-label{display:none}.user-name{font-size:12px}.welcome h1{font-size:28px}}
</style>
</head>
<body>
<header class="header"><div class="header-inner"><div class="logo-title"><div class="logo">P</div><div class="title">PRAVINS <span>PAN PORTAL</span></div></div><div class="user-area"><div><div class="user-name" id="retailerName">Retailer</div><div class="user-label">RETAILER ACCOUNT</div></div><button class="logout" onclick="logout()">Logout</button></div></div></header>
<main class="main">
  <section class="welcome">
    <h1>PAN CARD APPLY</h1>
    <p>Enter applicant name and upload the application document.</p>
  </section>

  <section class="service-card form-card">
    <label for="applicantName">Name</label>
    <input id="applicantName" type="text" placeholder="Enter applicant name" autocomplete="name">

    <label for="applicationFile">Upload File</label>
    <input id="applicationFile" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp">
    <div class="file-note">Maximum file size: 3 MB</div>

    <button class="apply-btn" id="submitBtn" onclick="submitApplication()">SUBMIT</button>
    <div id="formMessage" class="form-message"></div>
  </section>

  <section class="service-card status-card">
    <h2>My Applications</h2>
    <div id="myApplications" class="empty">No applications submitted yet.</div>
  </section>
</main>
<script>
const DB_NAME="pravins_pan_portal_db";
const STORE="applications";

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:"id"});
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function getApplications(){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readonly");
    const req=tx.objectStore(STORE).getAll();
    req.onsuccess=()=>resolve(req.result||[]);
    req.onerror=()=>reject(req.error);
  });
}
async function saveApplication(app){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).put(app);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}

function checkLogin(){
  if(sessionStorage.getItem("retailer_logged_in")!=="true"){location.href="index.html";return}
  document.getElementById("retailerName").textContent=
    sessionStorage.getItem("retailer_name")||sessionStorage.getItem("retailer_username")||"Retailer";
}
function logout(){sessionStorage.clear();location.href="index.html"}

function showFormMessage(text,ok){
  const m=document.getElementById("formMessage");
  m.className="form-message "+(ok?"ok":"err");
  m.textContent=text;
  m.style.display="block";
}

async function submitApplication(){
  const name=document.getElementById("applicantName").value.trim();
  const file=document.getElementById("applicationFile").files[0];
  const btn=document.getElementById("submitBtn");

  document.getElementById("formMessage").style.display="none";

  if(!name){showFormMessage("Please enter name.",false);return}
  if(!file){showFormMessage("Please select a file.",false);return}
  if(file.size>3*1024*1024){showFormMessage("File must be 3 MB or less.",false);return}

  btn.disabled=true; btn.textContent="SUBMITTING...";
  try{
    const dataUrl=await fileToDataURL(file);
    const app={
      id:"PAN-"+Date.now()+"-"+Math.random().toString(36).slice(2,8).toUpperCase(),
      name,
      retailerName:sessionStorage.getItem("retailer_name")||"Retailer",
      retailerUsername:sessionStorage.getItem("retailer_username")||"",
      retailerMobile:sessionStorage.getItem("retailer_mobile")||"",
      fileName:file.name,
      fileType:file.type||"application/octet-stream",
      fileSize:file.size,
      fileData:dataUrl,
      acknowledgement:"",
      createdAt:Date.now()
    };
    await saveApplication(app);
    document.getElementById("applicantName").value="";
    document.getElementById("applicationFile").value="";
    showFormMessage("Application submitted successfully.",true);
    renderMyApplications();
  }catch(e){
    console.error(e);
    showFormMessage("Unable to submit application. Please try again.",false);
  }finally{
    btn.disabled=false;btn.textContent="SUBMIT";
  }
}

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(reader.error);
    reader.readAsDataURL(file);
  });
}

async function renderMyApplications(){
  const box=document.getElementById("myApplications");
  try{
    const username=sessionStorage.getItem("retailer_username")||"";
    const apps=(await getApplications())
      .filter(a=>a.retailerUsername===username)
      .sort((a,b)=>b.createdAt-a.createdAt);
    if(!apps.length){box.className="empty";box.innerHTML="No applications submitted yet.";return}
    box.className="";
    box.innerHTML=apps.map(a=>`
      <div class="application-status">
        <b>${escapeHtml(a.name)}</b>
        <small>${escapeHtml(a.fileName)} • ${new Date(a.createdAt).toLocaleString("en-IN")}</small>
        ${a.acknowledgement
          ? `<div class="ack">✓ Acknowledgement: ${escapeHtml(a.acknowledgement)}</div>`
          : `<div class="pending-ack">⏳ Acknowledgement pending</div>`}
      </div>
    `).join("");
  }catch(e){console.error(e)}
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

checkLogin();
renderMyApplications();
window.addEventListener("focus",renderMyApplications);
</script>
</body>
</html>
